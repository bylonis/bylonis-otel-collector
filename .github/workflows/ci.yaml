name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: No new SigNoz references
        run: scripts/check-signoz-refs.sh

      - name: gofmt (changed files only; upstream has unformatted files)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=AM FETCH_HEAD -- '*.go')
          [ -z "$files" ] && exit 0
          bad=$(gofmt -l $files)
          [ -z "$bad" ] || { echo "::error::gofmt needed: $bad"; exit 1; }

      - name: Build
        run: |
          go build ./...
          CGO_ENABLED=0 go build -o /dev/null ./cmd/bylonisotelcollector
          CGO_ENABLED=0 go build -o /dev/null ./cmd/bylonisschemamigrator

      - name: Vet
        run: go vet ./...

      # Skipped tests fail or flake in upstream v0.144.5 too:
      #   TestExporterPushLogsData    always (expects a usage insert that never happens)
      #   TestExporterPushTracesData  flaky (same usage expectation, timing)
      #   TestMetricsToMetrics        flaky (custom_dimensions flush timing)
      - name: Test
        run: go test -count=1 -timeout 30m -skip 'TestExporterPushLogsData|TestExporterPushTracesData|TestMetricsToMetrics' ./...
